<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중고 노트북 LTE 매물 검색</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🖥️ 중고 노트북 LTE 매물 검색</h1>
            <p class="subtitle">중고나라 · 번개장터 · 당근마켓 자동 검색</p>
        </header>

        <div class="search-section">
            <div class="search-info">
                <h2>검색 조건</h2>
                <ul class="conditions-list">
                    <li>✅ 360도 회전 가능 (2-in-1)</li>
                    <li>✅ Thunderbolt 3/4 포함</li>
                    <li>✅ LTE/WWAN 모듈 탑재</li>
                    <li>✅ RAM 16GB 이상</li>
                    <li>✅ Intel i5 7세대 이상</li>
                    <li>✅ 가격: 30~60만원</li>
                </ul>
            </div>

            <div class="search-controls">
                <button id="searchBtn" class="btn-search">
                    <span class="btn-icon">🔍</span>
                    <span class="btn-text">검색 시작</span>
                </button>
                <button id="viewResultsBtn" class="btn-secondary" style="display: none;">
                    <span class="btn-icon">📋</span>
                    <span class="btn-text">결과 보기</span>
                </button>
            </div>

            <div id="progressSection" class="progress-section" style="display: none;">
                <div class="progress-header">
                    <span id="progressMessage" class="progress-message">검색 준비 중...</span>
                    <span id="progressPercent" class="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="progress-info">
                    <div class="info-item">
                        <span class="label">현재 사이트:</span>
                        <span id="currentSite" class="value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="label">발견:</span>
                        <span id="totalFound" class="value">0개</span>
                    </div>
                    <div class="info-item">
                        <span class="label">필터링 후:</span>
                        <span id="filteredCount" class="value">0개</span>
                    </div>
                </div>
            </div>

            <div id="errorSection" class="error-section" style="display: none;">
                <div class="error-message">
                    <span class="error-icon">⚠️</span>
                    <span id="errorText"></span>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>📱 모바일과 데스크탑 모두 지원</p>
            <p class="note">※ 검색 시간은 약 1-2분 소요됩니다</p>
        </footer>
    </div>

    <script>
        const searchBtn = document.getElementById('searchBtn');
        const viewResultsBtn = document.getElementById('viewResultsBtn');
        const progressSection = document.getElementById('progressSection');
        const errorSection = document.getElementById('errorSection');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const progressMessage = document.getElementById('progressMessage');
        const currentSite = document.getElementById('currentSite');
        const totalFound = document.getElementById('totalFound');
        const filteredCount = document.getElementById('filteredCount');
        const errorText = document.getElementById('errorText');

        let statusCheckInterval = null;

        // 검색 시작
        searchBtn.addEventListener('click', async () => {
            try {
                searchBtn.disabled = true;
                searchBtn.classList.add('loading');
                progressSection.style.display = 'block';
                errorSection.style.display = 'none';
                viewResultsBtn.style.display = 'none';

                const response = await fetch('/start-search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    // 상태 체크 시작
                    startStatusCheck();
                } else {
                    showError(data.message);
                    searchBtn.disabled = false;
                    searchBtn.classList.remove('loading');
                }
            } catch (error) {
                showError('검색 시작 실패: ' + error.message);
                searchBtn.disabled = false;
                searchBtn.classList.remove('loading');
            }
        });

        // 결과 보기
        viewResultsBtn.addEventListener('click', () => {
            window.location.href = '/results';
        });

        // 상태 체크 시작
        function startStatusCheck() {
            if (statusCheckInterval) {
                clearInterval(statusCheckInterval);
            }

            statusCheckInterval = setInterval(checkStatus, 1000);
        }

        // 상태 체크
        async function checkStatus() {
            try {
                const response = await fetch('/search-status');
                const status = await response.json();

                updateProgress(status);

                if (!status.is_running && status.progress === 100) {
                    // 검색 완료
                    clearInterval(statusCheckInterval);
                    searchBtn.disabled = false;
                    searchBtn.classList.remove('loading');
                    viewResultsBtn.style.display = 'block';

                    progressMessage.textContent = '검색 완료! 🎉';

                } else if (!status.is_running && status.error) {
                    // 오류 발생
                    clearInterval(statusCheckInterval);
                    searchBtn.disabled = false;
                    searchBtn.classList.remove('loading');
                    showError(status.error);
                }
            } catch (error) {
                console.error('상태 체크 실패:', error);
            }
        }

        // 진행률 업데이트
        function updateProgress(status) {
            progressFill.style.width = status.progress + '%';
            progressPercent.textContent = status.progress + '%';
            progressMessage.textContent = status.message;
            currentSite.textContent = status.current_site || '-';
            totalFound.textContent = status.total_found + '개';
            filteredCount.textContent = status.filtered_count + '개';
        }

        // 오류 표시
        function showError(message) {
            errorSection.style.display = 'block';
            errorText.textContent = message;
        }
    </script>
</body>
</html>
