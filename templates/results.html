<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색 결과 - 중고 노트북 LTE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🖥️ 검색 결과</h1>
            <button onclick="window.location.href='/'" class="btn-back">← 돌아가기</button>
        </header>

        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">-</div>
                <div class="stat-label">총 매물</div>
            </div>
            <div class="stat-card">
                <div class="stat-value new" id="newCount">-</div>
                <div class="stat-label">신규 매물</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="priceRange">-</div>
                <div class="stat-label">가격대</div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">전체</button>
                <button class="filter-btn" data-filter="new">신규만</button>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn active" data-sort="latest">최신순</button>
                <button class="sort-btn" data-sort="price-low">가격 낮은순</button>
                <button class="sort-btn" data-sort="price-high">가격 높은순</button>
            </div>
        </div>

        <div id="resultsContainer" class="results-container">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>결과 불러오는 중...</p>
            </div>
        </div>
    </div>

    <script>
        let allResults = [];
        let filteredResults = [];
        let currentFilter = 'all';
        let currentSort = 'latest';

        // 페이지 로드 시 결과 가져오기
        window.addEventListener('DOMContentLoaded', loadResults);

        // 결과 로드
        async function loadResults() {
            try {
                const response = await fetch('/api/results');
                const data = await response.json();

                allResults = data.results;
                filteredResults = [...allResults];

                updateStats(data.stats);
                renderResults();
            } catch (error) {
                showError('결과를 불러오는데 실패했습니다: ' + error.message);
            }
        }

        // 통계 업데이트
        function updateStats(stats) {
            document.getElementById('totalCount').textContent = stats.total_count || 0;
            document.getElementById('newCount').textContent = stats.new_count || 0;

            const priceRange = stats.price_range;
            if (priceRange && priceRange.min && priceRange.max) {
                const minPrice = Math.floor(priceRange.min / 10000);
                const maxPrice = Math.floor(priceRange.max / 10000);
                document.getElementById('priceRange').textContent = `${minPrice}~${maxPrice}만원`;
            } else {
                document.getElementById('priceRange').textContent = '-';
            }
        }

        // 결과 렌더링
        function renderResults() {
            const container = document.getElementById('resultsContainer');

            if (filteredResults.length === 0) {
                container.innerHTML = '<div class="empty-state">조건에 맞는 매물이 없습니다.</div>';
                return;
            }

            const html = filteredResults.map(item => createCard(item)).join('');
            container.innerHTML = html;
        }

        // 카드 생성
        function createCard(item) {
            const newBadge = item.is_new ? '<span class="badge badge-new">NEW</span>' : '';
            const price = formatPrice(item.specs?.price);
            const cpu = item.specs?.cpu || '정보 없음';
            const ram = item.specs?.ram ? `${item.specs.ram}GB` : '정보 없음';
            const keywords = (item.matched_keywords || []).map(k =>
                `<span class="keyword">${k}</span>`
            ).join('');
            const location = item.location || '위치 정보 없음';
            const source = item.source || 'unknown';

            return `
                <div class="result-card ${item.is_new ? 'new' : ''}">
                    <div class="card-header">
                        <div class="card-title">${escapeHtml(item.title)}</div>
                        <div class="card-badges">
                            ${newBadge}
                            <span class="badge badge-source">${source}</span>
                        </div>
                    </div>
                    <div class="card-price">${price}</div>
                    <div class="card-specs">
                        <div class="spec-item">💻 ${cpu}</div>
                        <div class="spec-item">🧠 ${ram}</div>
                    </div>
                    <div class="card-keywords">${keywords}</div>
                    <div class="card-footer">
                        <div class="card-location">📍 ${location}</div>
                        <a href="${item.url}" target="_blank" class="btn-view">상세보기</a>
                    </div>
                </div>
            `;
        }

        // 가격 포맷
        function formatPrice(price) {
            if (!price) return '가격 문의';
            if (price >= 10000) {
                return Math.floor(price / 10000) + '만원';
            }
            return price.toLocaleString() + '원';
        }

        // HTML 이스케이프
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 필터링
        function applyFilter() {
            if (currentFilter === 'all') {
                filteredResults = [...allResults];
            } else if (currentFilter === 'new') {
                filteredResults = allResults.filter(item => item.is_new);
            }

            applySort();
            renderResults();
        }

        // 정렬
        function applySort() {
            if (currentSort === 'latest') {
                filteredResults.sort((a, b) =>
                    new Date(b.timestamp) - new Date(a.timestamp)
                );
            } else if (currentSort === 'price-low') {
                filteredResults.sort((a, b) => {
                    const priceA = a.specs?.price || Infinity;
                    const priceB = b.specs?.price || Infinity;
                    return priceA - priceB;
                });
            } else if (currentSort === 'price-high') {
                filteredResults.sort((a, b) => {
                    const priceA = a.specs?.price || 0;
                    const priceB = b.specs?.price || 0;
                    return priceB - priceA;
                });
            }
        }

        // 필터 버튼 이벤트
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilter();
            });
        });

        // 정렬 버튼 이벤트
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                applySort();
                renderResults();
            });
        });

        // 오류 표시
        function showError(message) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = `<div class="error-state">❌ ${message}</div>`;
        }
    </script>
</body>
</html>
