services:
  - type: web
    name: notebook-lte-search
    env: python
    region: singapore
    plan: free
    branch: claude/used-notebook-lte-crawler-011CUeJBMB3N9z5bCYmQa95g
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
