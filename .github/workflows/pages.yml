name: 추첨 페이지 배포 (GitHub Pages)

# raffle/ 폴더만 GitHub Pages로 배포합니다. (기존 Render 앱과 무관)
on:
  push:
    branches: [main]
    paths:
      - "raffle/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정 (없으면 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 추첨 페이지 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: raffle

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
